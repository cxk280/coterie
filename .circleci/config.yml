version: 2.1

# CI for the Coterie CLI (packages/coterie-js): build, typecheck, lint, vitest.

jobs:
  js:
    docker:
      # 22.13+ to satisfy ESLint 9's engine floor (^22.13.0); see the lint step.
      - image: cimg/node:22.13
    steps:
      - checkout
      - run:
          name: Install
          command: npm ci
      - run:
          name: Build
          command: npm run build -w packages/coterie-js
      - run:
          name: Typecheck
          command: npx tsc -p packages/coterie-js/tsconfig.json --noEmit
      - run:
          name: Lint
          command: npm run lint -w packages/coterie-js
      - run:
          name: Tests
          command: npm test -w packages/coterie-js

workflows:
  ci:
    jobs:
      - js
