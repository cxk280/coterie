version: 2.1

# CI for the Coterie CLI (packages/coterie-js): build, typecheck, vitest.

jobs:
  js:
    docker:
      - image: cimg/node:22.11
    steps:
      - checkout
      - run:
          name: Install
          command: npm ci
      - run:
          name: Build
          command: npm run build -w packages/coterie-js
      - run:
          name: Typecheck
          command: npx tsc -p packages/coterie-js/tsconfig.json --noEmit
      - run:
          name: Tests
          command: npm test -w packages/coterie-js

workflows:
  ci:
    jobs:
      - js
