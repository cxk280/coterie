id: rename-foo-to-bar
category: refactor
prompt: "Rename `foo` → `bar` across src/ and update tests."
expected_modes:
  - single
  - adversarial
  - tournament
workdir_setup:
  src/foo.py: |
    def bar():
        """Renamed from foo by the bench fixture."""
        return 42
  tests/test_bar.py: |
    from src.foo import bar


    def test_bar_returns_42():
        assert bar() == 42
graders:
  - kind: file_contains
    path: src/foo.py
    text: bar
  - kind: file_absent
    path: src/foo.py
    text: "def foo"
  - kind: status_done
