id: find-bugs-router
category: review
prompt: "Find every bug in pkg/router/. Return only structured findings."
expected_modes:
  - consensus
  - adversarial
workdir_setup:
  pkg/router/router.py: |
    def route(req):
        if req.path == "/admin":
            return admin_handler(req)
        # FIXME: race condition — token swap between threads
        return default_handler(req)
graders:
  - kind: findings_severity_at_least
    severity: medium
  - kind: status_done
