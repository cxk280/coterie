[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "coterie"
version = "0.0.1"
description = "A LangGraph orchestrator for heterogeneous coding agents (Claude Code, Codex, Cursor, Aider) and dev tools."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "Chris King", email = "chris@cking.me"}]
keywords = ["langgraph", "agents", "llm", "orchestration", "claude", "codex", "aider"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development",
]
dependencies = [
  "langgraph>=0.2.0",
  "anthropic>=0.40.0",
  "pydantic>=2.0",
  "pyyaml>=6.0",
  "jsonschema>=4.21",
  "rich>=13.7",
  "click>=8.1",
  "opentelemetry-api>=1.27",
  "opentelemetry-sdk>=1.27",
]

[project.optional-dependencies]
openai = [
  "openai>=1.40",
]
observability = [
  "opentelemetry-exporter-otlp-proto-http>=1.27",
]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "ruff>=0.5",
  "mypy>=1.10",
  "openai>=1.40",
  "opentelemetry-exporter-otlp-proto-http>=1.27",
]

[project.scripts]
coterie = "coterie.cli:main"

[project.urls]
Homepage = "https://coterie.dev"
Repository = "https://github.com/cking/coterie"
Issues = "https://github.com/cking/coterie/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/coterie"]
