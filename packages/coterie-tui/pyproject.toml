[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "coterie-tui"
version = "0.1.0"
description = "Rich-based TUI client for the Coterie HTTP API."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "Chris King", email = "chris@cking.me"}]
dependencies = [
  "click>=8.1",
  "httpx>=0.27",
  "httpx-sse>=0.4",
  "rich>=13.7",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
coterie-tui = "coterie_tui.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/coterie_tui"]
