[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "coterie-api"
version = "0.1.0"
description = "FastAPI HTTP server fronting the Coterie graph runner. Powers the coterie-web dashboard."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "Chris King", email = "chris@cking.me"}]
keywords = ["coterie", "langgraph", "agents", "fastapi"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Topic :: Software Development",
]
dependencies = [
  "coterie",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.0",
  "sse-starlette>=2.1",
  "langgraph-checkpoint-sqlite>=2.0",
  "httpx>=0.27",
  "authlib>=1.3",
  "itsdangerous>=2.2",
  "opentelemetry-api>=1.27",
  "opentelemetry-sdk>=1.27",
  "opentelemetry-exporter-otlp-proto-http>=1.27",
  "opentelemetry-instrumentation-fastapi>=0.48b0",
  "slowapi>=0.1.9",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "httpx>=0.27",
  "pytest-asyncio>=0.23",
]

[project.scripts]
coterie-api = "coterie_api.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/coterie_api"]

[tool.uv.sources]
coterie = { path = "../coterie-py", editable = true }
