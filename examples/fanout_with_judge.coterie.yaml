# Two agents race; a judge model picks the winner per subtask.
# Costs ~2x baseline — use for high-stakes work.
version: 1
agents:
  - id: claude
    adapter: claude-code
    strengths: [planning, refactor]
  - id: codex
    adapter: codex
    strengths: [algorithmic, tight-diffs]
router:
  enabled: true
  strategy: llm
fanout:
  enabled: true
  pair: [claude, codex]
  judge:
    model: claude-opus-4-7
    criteria: [correctness, minimal-diff, tests-pass, clarity]
checkpoints:
  before_git_commit: true   # always confirm commits
budget:
  max_usd_per_task: 5.00
  warn_at_usd: 2.00
  on_exceed: checkpoint
observability:
  provider: file
  log_dir: .coterie/logs
