name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: python (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install workspace packages
        run: |
          python -m pip install --upgrade pip
          pip install -e "packages/coterie-py[dev]"
          pip install -e "packages/coterie-api[dev]"
          pip install -e "packages/coterie-bench[dev]"
          pip install -e "packages/coterie-tui[dev]"
      - name: Lint (ruff)
        run: ruff check .
      - name: Tests
        run: |
          pytest -q \
            packages/coterie-py/tests \
            packages/coterie-api/tests \
            packages/coterie-bench/tests \
            packages/coterie-tui/tests

  js:
    name: js (coterie-js)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install (workspaces)
        run: npm ci
      - name: Build
        run: npm run build -w packages/coterie-js
      - name: Typecheck
        run: npx tsc -p packages/coterie-js/tsconfig.json --noEmit
      - name: Tests
        run: npm test -w packages/coterie-js

  web:
    name: web (coterie-web)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/coterie-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: packages/coterie-web/package-lock.json
      - name: Install
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: E2E smoke
        run: npm run test:e2e
        env:
          PW_USE_WEBSERVER: "1"
